<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Offshore software development team building web, mobile and AI products">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/>
    </linearGradient>
    <linearGradient id="h-v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="h-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbd07a"/><stop offset="100%" stop-color="#d99a26"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".38"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#h-bg)"/>
  <rect width="800" height="500" fill="url(#h-glow)"/>
