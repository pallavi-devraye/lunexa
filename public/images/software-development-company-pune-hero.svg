  <path d="M700 96h24M712 84v24" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="452" cy="424" r="26" fill="#271A44" stroke="#f4b740" stroke-opacity=".5"/>
