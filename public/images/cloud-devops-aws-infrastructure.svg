<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cloud infrastructure with CI/CD pipeline, containers and monitoring">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/></linearGradient>
    <linearGradient id="c-v" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="c-g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fbd07a"/><stop offset="100%" stop-color="#d99a26"/></linearGradient>
    <radialGradient id="c-glow" cx="50%" cy="20%" r="60%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#c-bg)"/><rect width="640" height="400" fill="url(#c-glow)"/>

  <!-- Cloud -->
  <path d="M212 118c0-26 21-47 47-47 19 0 35 11 43 27 5-3 11-5 17-5 18 0 33 15 33 33 0 2 0 4-1 6 17 3 30 18 30 36 0 20-16 37-37 37H222c-24 0-43-19-43-43 0-20 14-37 33-42v-2z" fill="#1C1330" stroke="#a78bfa" stroke-opacity=".45" stroke-width="2"/>
  <text x="290" y="146" font-family="Sora, Inter, sans-serif" font-size="26" font-weight="700" fill="#a78bfa" text-anchor="middle">AWS</text>
  <rect x="248" y="158" width="84" height="8" rx="4" fill="#ffffff" fill-opacity=".16"/>

  <!-- Pipeline -->
  <g transform="translate(0 232)">
    <path d="M92 28h420" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>
    <path d="M92 28h300" stroke="url(#c-g)" stroke-width="3"/>
    <g>
      <circle cx="92" cy="28" r="22" fill="#271A44" stroke="#f4b740" stroke-width="2"/>
      <path d="M84 28h16M92 20v16" stroke="#f4b740" stroke-width="3" stroke-linecap="round"/>
      <rect x="62" y="62" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    </g>
    <g>
      <circle cx="192" cy="28" r="22" fill="#271A44" stroke="#f4b740" stroke-width="2"/>
      <path d="M184 28l6 7 12-14" stroke="#f4b740" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="162" y="62" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    </g>
    <g>
      <circle cx="292" cy="28" r="22" fill="#271A44" stroke="#f4b740" stroke-width="2"/>
      <rect x="282" y="18" width="20" height="20" rx="4" fill="none" stroke="#f4b740" stroke-width="3"/>
      <rect x="252" y="62" width="80" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    </g>
    <g>
      <circle cx="392" cy="28" r="22" fill="#271A44" stroke="#a78bfa" stroke-width="2"/>
      <path d="M392 18l10 10-10 10-10-10z" fill="#a78bfa"/>
      <rect x="362" y="62" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    </g>
    <g opacity=".6">
      <circle cx="492" cy="28" r="22" fill="#271A44" stroke="#ffffff" stroke-opacity=".3" stroke-width="2"/>
      <path d="M484 28h16" stroke="#ffffff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      <rect x="462" y="62" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".14"/>
    </g>
  </g>

  <!-- Containers -->
  <g transform="translate(64 60)">
    <rect width="112" height="112" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <g fill="#a78bfa">
      <rect x="22" y="40" width="18" height="16" rx="3"/><rect x="44" y="40" width="18" height="16" rx="3"/><rect x="66" y="40" width="18" height="16" rx="3"/>
      <rect x="33" y="20" width="18" height="16" rx="3" fill-opacity=".7"/><rect x="55" y="20" width="18" height="16" rx="3" fill-opacity=".7"/>
    </g>
    <path d="M18 64c0 14 11 24 26 24h20c14 0 24-10 26-24" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <rect x="26" y="96" width="60" height="7" rx="3.5" fill="#ffffff" fill-opacity=".18"/>
  </g>

  <!-- Monitoring -->
  <g transform="translate(464 60)">
    <rect width="112" height="112" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <polyline points="18,74 36,54 52,64 70,34 86,46 96,28" fill="none" stroke="url(#c-g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="96" cy="28" r="5" fill="#f4b740"/>
    <g fill="#ffffff" fill-opacity=".14"><rect x="18" y="88" width="34" height="7" rx="3.5"/><rect x="58" y="88" width="38" height="7" rx="3.5"/></g>
  </g>

  <!-- Cost badge -->
  <g transform="translate(258 336)">
    <rect width="124" height="38" rx="19" fill="#271A44" stroke="#f4b740" stroke-opacity=".5"/>
    <path d="M28 26l7-8 6 5 9-12" stroke="#f4b740" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 11h6v6" stroke="#f4b740" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="15" width="42" height="8" rx="4" fill="#ffffff" fill-opacity=".22"/>
  </g>
