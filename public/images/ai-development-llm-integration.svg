    <rect width="114" height="72" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <path d="M18 20h44a8 8 0 018 8v18a8 8 0 01-8 8H36l-12 10V56h-6a8 8 0 01-8-8V28a8 8 0 018-8z" fill="url(#a-v)"/>
    <rect x="82" y="28" width="20" height="7" rx="3.5" fill="#ffffff" fill-opacity=".22"/>
    <rect x="82" y="42" width="14" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
  </g>
  <g transform="translate(486 248)">
