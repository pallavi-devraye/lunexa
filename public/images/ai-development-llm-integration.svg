<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="AI assistant with retrieval from documents, guardrails and workflow automation">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/></linearGradient>
    <linearGradient id="a-v" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="a-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbd07a"/><stop offset="100%" stop-color="#d99a26"/></linearGradient>
    <radialGradient id="a-core" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="60%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#4c1d95"/></radialGradient>
    <radialGradient id="a-glow" cx="50%" cy="45%" r="55%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#a-bg)"/><rect width="640" height="400" fill="url(#a-glow)"/>

  <!-- Connection lines -->
  <g stroke="#a78bfa" stroke-opacity=".35" stroke-width="2" fill="none" stroke-dasharray="6 7">
    <path d="M154 118 274 182"/><path d="M154 282 274 218"/><path d="M366 182 486 118"/><path d="M366 218 486 282"/><path d="M320 128V96"/>
  </g>

  <!-- Core -->
  <circle cx="320" cy="200" r="72" fill="#1C1330" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="320" cy="200" r="46" fill="url(#a-core)"/>
  <circle cx="320" cy="200" r="46" fill="none" stroke="#ffffff" stroke-opacity=".3"/>
  <g stroke="#ffffff" stroke-opacity=".75" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M304 190v20M312 184v32M320 176v48M328 184v32M336 190v20"/>
  </g>
  <ellipse cx="320" cy="200" rx="72" ry="26" fill="none" stroke="#f4b740" stroke-opacity=".45" stroke-width="2"/>
  <ellipse cx="320" cy="200" rx="26" ry="72" fill="none" stroke="#a78bfa" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="392" cy="200" r="6" fill="#f4b740"/>
  <circle cx="320" cy="128" r="6" fill="#a78bfa"/>

  <!-- Left: sources -->
  <g transform="translate(40 84)">
    <rect width="114" height="72" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="18" y="16" width="34" height="42" rx="5" fill="#a78bfa" fill-opacity=".8"/>
    <rect x="24" y="24" width="22" height="4" rx="2" fill="#0E0A18" fill-opacity=".6"/>
    <rect x="24" y="33" width="22" height="4" rx="2" fill="#0E0A18" fill-opacity=".6"/>
    <rect x="24" y="42" width="14" height="4" rx="2" fill="#0E0A18" fill-opacity=".6"/>
    <rect x="64" y="24" width="36" height="7" rx="3.5" fill="#ffffff" fill-opacity=".22"/>
    <rect x="64" y="38" width="26" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
  </g>
  <g transform="translate(40 248)">
    <rect width="114" height="72" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <ellipse cx="36" cy="26" rx="18" ry="7" fill="#f4b740" fill-opacity=".8"/>
    <path d="M18 26v22c0 4 8 7 18 7s18-3 18-7V26" fill="none" stroke="#f4b740" stroke-opacity=".8" stroke-width="3"/>
    <path d="M18 37c0 4 8 7 18 7s18-3 18-7" fill="none" stroke="#f4b740" stroke-opacity=".5" stroke-width="2"/>
    <rect x="64" y="26" width="36" height="7" rx="3.5" fill="#ffffff" fill-opacity=".22"/>
    <rect x="64" y="40" width="26" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
  </g>

  <!-- Right: outputs -->
