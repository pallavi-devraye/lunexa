    <circle cx="30" cy="24" r="9" fill="none" stroke="#fbd07a" stroke-width="3"/>
    <circle cx="30" cy="52" r="9" fill="none" stroke="#fbd07a" stroke-width="3"/>
    <path d="M30 33v10" stroke="#fbd07a" stroke-width="3"/>
    <path d="M39 24h20M39 52h20" stroke="#ffffff" stroke-opacity=".2" stroke-width="3" stroke-linecap="round"/>
    <rect x="70" y="20" width="32" height="7" rx="3.5" fill="#ffffff" fill-opacity=".22"/>
    <rect x="70" y="48" width="24" height="7" rx="3.5" fill="#ffffff" fill-opacity=".14"/>
  </g>

  <!-- Guardrail badge -->
  <g transform="translate(266 42)">
    <rect width="108" height="36" rx="18" fill="#271A44" stroke="#f4b740" stroke-opacity=".45"/>
    <path d="M26 9l10 4v7c0 5-4 9-10 11-6-2-10-6-10-11v-7z" fill="#f4b740"/>
