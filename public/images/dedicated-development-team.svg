    <g fill="#ffffff" fill-opacity=".14"><rect x="88" y="168" width="64" height="6" rx="3"/><rect x="88" y="230" width="56" height="6" rx="3"/><rect x="88" y="292" width="60" height="6" rx="3"/></g>

    <!-- Column 2 -->
    <rect x="196" y="106" width="120" height="226" rx="12" fill="#0E0A18"/>
    <rect x="210" y="120" width="56" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>
    <g fill="#271A44"><rect x="210" y="140" width="92" height="52" rx="10"/><rect x="210" y="202" width="92" height="52" rx="10"/></g>
    <rect x="210" y="140" width="92" height="52" rx="10" fill="#8b5cf6" fill-opacity=".2" stroke="#a78bfa" stroke-opacity=".5"/>
    <g fill="#f4b740"><rect x="222" y="154" width="28" height="6" rx="3"/></g>
    <g fill="#a78bfa"><rect x="222" y="216" width="32" height="6" rx="3"/></g>
