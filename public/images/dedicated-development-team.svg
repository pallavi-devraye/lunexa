  <rect x="40" y="46" width="416" height="42" rx="16" fill="#271A44"/><rect x="40" y="72" width="416" height="16" fill="#271A44"/>
  <rect x="62" y="61" width="88" height="12" rx="6" fill="url(#t-v)"/>
