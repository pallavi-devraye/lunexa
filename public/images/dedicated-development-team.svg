    <rect x="344" y="120" width="44" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>
    <g fill="#271A44"><rect x="344" y="140" width="82" height="52" rx="10"/><rect x="344" y="202" width="82" height="52" rx="10"/><rect x="344" y="264" width="82" height="52" rx="10"/></g>
    <g stroke="#4ade80" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
