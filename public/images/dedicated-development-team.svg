<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A dedicated offshore engineering team working in the client's own tools and rituals">
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/></linearGradient>
    <linearGradient id="t-v" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <radialGradient id="t-glow" cx="50%" cy="18%" r="62%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#t-bg)"/><rect width="640" height="400" fill="url(#t-glow)"/>

  <!-- Kanban board -->
