<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="UI UX design process from wireframes to prototype and design system">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/></linearGradient>
    <linearGradient id="d-v" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <radialGradient id="d-glow" cx="60%" cy="20%" r="60%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#d-bg)"/><rect width="640" height="400" fill="url(#d-glow)"/>

  <!-- Wireframe -->
  <g transform="translate(48 76)">
    <rect width="164" height="248" rx="14" fill="#0E0A18" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="6 5"/>
    <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2">
      <rect x="20" y="22" width="124" height="40" rx="6"/>
      <path d="M20 42h124M60 22v40"/>
      <rect x="20" y="76" width="124" height="60" rx="6"/>
      <path d="M20 76l124 60M144 76L20 136"/>
      <rect x="20" y="150" width="58" height="34" rx="6"/>
      <rect x="86" y="150" width="58" height="34" rx="6"/>
      <rect x="20" y="198" width="80" height="26" rx="13"/>
    </g>
    <rect x="30" y="258" width="104" height="8" rx="4" fill="#ffffff" fill-opacity=".16"/>
  </g>

  <!-- Arrow -->
  <path d="M228 200h44" stroke="#a78bfa" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  <path d="M264 192l10 8-10 8" fill="none" stroke="#a78bfa" stroke-opacity=".7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hi-fi design -->
  <g transform="translate(290 60)">
    <rect width="180" height="280" rx="18" fill="#1C1330" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="18" y="22" width="144" height="52" rx="10" fill="url(#d-v)"/>
    <rect x="32" y="36" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".6"/>
    <rect x="32" y="52" width="90" height="10" rx="5" fill="#ffffff" fill-opacity=".85"/>
    <rect x="18" y="88" width="144" height="64" rx="10" fill="#271A44"/>
    <circle cx="46" cy="120" r="16" fill="#f4b740" fill-opacity=".65"/>
    <rect x="72" y="110" width="72" height="8" rx="4" fill="#ffffff" fill-opacity=".2"/>
    <rect x="72" y="124" width="52" height="7" rx="3.5" fill="#ffffff" fill-opacity=".12"/>
    <rect x="18" y="166" width="68" height="46" rx="10" fill="#271A44"/>
    <rect x="94" y="166" width="68" height="46" rx="10" fill="#271A44"/>
    <rect x="34" y="184" width="36" height="8" rx="4" fill="#a78bfa"/>
    <rect x="110" y="184" width="36" height="8" rx="4" fill="#a78bfa"/>
    <rect x="18" y="228" width="144" height="32" rx="16" fill="url(#d-v)"/>
    <rect x="60" y="240" width="60" height="8" rx="4" fill="#ffffff" fill-opacity=".7"/>
  </g>

  <!-- Design tokens -->
  <g transform="translate(500 76)">
    <rect width="98" height="248" rx="14" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <rect x="18" y="20" width="52" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>
    <g>
      <circle cx="32" cy="52" r="12" fill="#a78bfa"/><circle cx="64" cy="52" r="12" fill="#6d28d9"/>
      <circle cx="32" cy="82" r="12" fill="#f4b740"/><circle cx="64" cy="82" r="12" fill="#fbd07a"/>
      <circle cx="32" cy="112" r="12" fill="#ffffff" fill-opacity=".3"/><circle cx="64" cy="112" r="12" fill="#ffffff" fill-opacity=".14"/>
    </g>
    <g fill="#ffffff" fill-opacity=".18">
      <rect x="18" y="142" width="62" height="12" rx="4"/>
      <rect x="18" y="162" width="48" height="9" rx="4"/>
      <rect x="18" y="179" width="38" height="7" rx="3.5"/>
    </g>
    <rect x="18" y="200" width="62" height="24" rx="12" fill="#8b5cf6" fill-opacity=".4" stroke="#a78bfa" stroke-opacity=".6"/>
  </g>

  <!-- Cursor -->
  <path d="M340 296l0 34 9-9 6 13 7-3-6-13h12z" fill="#ffffff" stroke="#0A0711" stroke-width="2"/>
</svg>
