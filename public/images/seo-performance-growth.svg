      <circle cx="26" cy="26" r="24" fill="none" stroke="url(#g-v)" stroke-width="6" stroke-linecap="round" stroke-dasharray="140 151" transform="rotate(-90 26 26)"/>
      <text x="26" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">98</text>
    </g>
    <g transform="translate(104 20)">
