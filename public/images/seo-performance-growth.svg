<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Search rankings, Core Web Vitals and organic traffic growth">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#150E24"/><stop offset="100%" stop-color="#0A0711"/></linearGradient>
    <linearGradient id="g-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f4b740" stop-opacity=".38"/><stop offset="100%" stop-color="#f4b740" stop-opacity="0"/></linearGradient>
    <radialGradient id="g-glow" cx="55%" cy="20%" r="60%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#g-bg)"/><rect width="640" height="400" fill="url(#g-glow)"/>

  <!-- Search results -->
  <g transform="translate(44 56)">
