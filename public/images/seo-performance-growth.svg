    <rect x="20" y="22" width="212" height="32" rx="16" fill="#271A44" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="42" cy="38" r="7" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M47 43l6 6" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="62" y="34" width="100" height="8" rx="4" fill="#ffffff" fill-opacity=".18"/>

    <g transform="translate(20 74)">
      <rect width="212" height="56" rx="10" fill="#8b5cf6" fill-opacity=".18" stroke="#a78bfa" stroke-opacity=".5"/>
      <circle cx="20" cy="20" r="9" fill="#f4b740"/>
      <text x="20" y="25" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0E0A18" text-anchor="middle">1</text>
      <rect x="38" y="14" width="120" height="9" rx="4.5" fill="#c4b5fd"/>
      <rect x="38" y="30" width="156" height="6" rx="3" fill="#ffffff" fill-opacity=".2"/>
      <rect x="38" y="41" width="110" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
    </g>
    <g transform="translate(20 142)" opacity=".7">
      <rect width="212" height="48" rx="10" fill="#271A44"/>
      <circle cx="20" cy="18" r="8" fill="#ffffff" fill-opacity=".2"/>
      <rect x="36" y="12" width="100" height="8" rx="4" fill="#ffffff" fill-opacity=".22"/>
      <rect x="36" y="27" width="150" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
    </g>
    <g transform="translate(20 202)" opacity=".5">
      <rect width="212" height="48" rx="10" fill="#271A44"/>
      <circle cx="20" cy="18" r="8" fill="#ffffff" fill-opacity=".2"/>
      <rect x="36" y="12" width="86" height="8" rx="4" fill="#ffffff" fill-opacity=".22"/>
      <rect x="36" y="27" width="140" height="6" rx="3" fill="#ffffff" fill-opacity=".12"/>
    </g>
  </g>

  <!-- Traffic chart -->
  <g transform="translate(324 56)">
    <rect width="272" height="176" rx="16" fill="#1C1330" stroke="#ffffff" stroke-opacity=".13"/>
    <rect x="22" y="22" width="86" height="9" rx="4.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="22" y="40" width="54" height="14" rx="7" fill="#f4b740"/>
    <path d="M24 148 L64 130 L104 136 L144 106 L184 112 L224 76 L250 62 L250 152 L24 152 Z" fill="url(#g-area)"/>
    <polyline points="24,148 64,130 104,136 144,106 184,112 224,76 250,62" fill="none" stroke="#f4b740" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="62" r="5.5" fill="#f4b740" stroke="#0A0711" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity=".07"><path d="M24 152h226M24 118h226M24 84h226"/></g>
  </g>

  <!-- Core Web Vitals -->
  <g transform="translate(324 252)">
    <rect width="272" height="92" rx="16" fill="#1C1330" stroke="#ffffff" stroke-opacity=".13"/>
    <g transform="translate(24 20)">
