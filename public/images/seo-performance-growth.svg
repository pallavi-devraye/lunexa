      <circle cx="26" cy="26" r="24" fill="none" stroke="#f4b740" stroke-width="6" stroke-linecap="round" stroke-dasharray="146 151" transform="rotate(-90 26 26)"/>
      <text x="26" y="31" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">100</text>
    </g>
    <g transform="translate(184 26)" fill="#ffffff" fill-opacity=".16">
      <rect width="64" height="8" rx="4"/><rect y="16" width="48" height="8" rx="4"/><rect y="32" width="56" height="8" rx="4"/>
